name: Ownership

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ownership:
    name: ownership.json up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout starters-webflow
        uses: actions/checkout@v4
        with:
          repository: the-starters/starters-webflow
          path: starters-webflow
          fetch-depth: 0
          # Public today — GITHUB_TOKEN is enough. If starters-webflow goes private,
          # set repo secret STARTERS_WEBFLOW_READ (contents:read) and switch the token.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ownership artifact
        env:
          STARTERS_WEBFLOW_ROOT: ${{ github.workspace }}/starters-webflow
        run: node scripts/generate-ownership.mjs --check
